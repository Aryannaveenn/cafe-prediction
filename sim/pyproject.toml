[project]
name = "cafesim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.108",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "simpy>=4.1.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
