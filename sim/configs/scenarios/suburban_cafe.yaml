# A different cafe, built on top of base.yaml.
# Only the settings listed here change; everything else
# is inherited from the base file.
extends: ../base.yaml

name: suburban_cafe

# Fewer customers overall.
base_hourly_rate: 18

# Suburban cafes are often busiest on weekends, not weekdays.
weekday_multipliers: [0.90, 0.90, 0.95, 1.00, 1.05, 1.30, 1.20]